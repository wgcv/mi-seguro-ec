{% load static %}
<!-- ============================================
     NAVBAR (partials/navbar.html)
     ============================================ -->
<header class="site-header">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="container">
      <div class="topbar-group">
        <!-- Address & hours (swappable) -->
        <span class="topbar-item" id="topbarAddress">
          <i data-lucide="map-pin"></i>
          <span>Av. Malecón Simón Bolívar & Calle Roca</span>
        </span>
        <span class="topbar-item" id="topbarHours">
          <i data-lucide="clock"></i>
          <span>Lun - Vie 8:30 - 17:00</span>
        </span>
        <span class="topbar-item" id="topbarPhone">
          <i data-lucide="phone"></i>
          <a href="tel:0993886877"><span>0993886877</span></a>
        </span>
      </div>
      <div class="topbar-group">
        
        <!-- City selector dropdown -->
        <div class="topbar-city-dropdown" id="cityDropdown">
          <button class="topbar-city-btn" id="cityDropdownBtn" aria-haspopup="listbox" aria-expanded="false">
            <i data-lucide="map-pin" style="width:12px;height:12px"></i>
            <span id="cityDropdownLabel">Guayaquil</span>
            <i data-lucide="chevron-down" class="topbar-chevron" style="width:11px;height:11px"></i>
          </button>
          <ul class="topbar-city-menu" role="listbox" id="cityDropdownMenu">
            <li role="option" class="topbar-city-option active" data-city="guayaquil">Guayaquil</li>
            <li role="option" class="topbar-city-option" data-city="manabi">Manabí</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var cityData = {
        guayaquil: {
          address: 'Av. Malecón Simón Bolívar & Calle Roca',
          hours:   'Lun - Vie 8:30 - 17:00',
          phone:   '0993886877',
        },
        manabi: {
          address: 'Av. Marcos Aray & Principal',
          hours:   'Lun - Vie 8:30 - 17:00',
          phone:   '0993886877',
        },
      };

      var btn   = document.getElementById('cityDropdownBtn');
      var menu  = document.getElementById('cityDropdownMenu');
      var label = document.getElementById('cityDropdownLabel');

      function setCity(city) {
        var d = cityData[city];
        document.querySelector('#topbarAddress span').textContent = d.address;
        document.querySelector('#topbarHours span').textContent   = d.hours;
        document.querySelector('#topbarPhone span').textContent   = d.phone;
        label.textContent = city.charAt(0).toUpperCase() + city.slice(1);
        menu.querySelectorAll('.topbar-city-option').forEach(function (el) {
          el.classList.toggle('active', el.dataset.city === city);
        });
        closeMenu();
      }

      function openMenu()  { btn.setAttribute('aria-expanded', 'true');  menu.classList.add('open'); }
      function closeMenu() { btn.setAttribute('aria-expanded', 'false'); menu.classList.remove('open'); }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        menu.classList.contains('open') ? closeMenu() : openMenu();
      });

      menu.querySelectorAll('.topbar-city-option').forEach(function (el) {
        el.addEventListener('click', function () { setCity(el.dataset.city); });
      });

      document.addEventListener('click', closeMenu);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
    })();
  </script>

  <!-- Main Navbar -->
  <nav class="navbar">
    <div class="container">

      <!-- Logo -->
      <a href="{% url 'home:index' %}" class="logo">
        <img src="{% static 'img/logo.png' %}" alt="Mi Seguro" />
      </a>

      <!-- Desktop Links -->
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#seguros">Seguros</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>


      <!-- Mobile Toggle -->
      <button id="mobile-toggle" class="mobile-toggle" aria-label="Abrir menu">
        <i id="menu-icon-open" data-lucide="menu" style="width:24px;height:24px"></i>
        <i id="menu-icon-close" data-lucide="x" style="width:24px;height:24px;display:none"></i>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="mobile-menu">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#seguros">Seguros</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
      <!--  FOOTER MOBILE MENU INFO
      <div class="mobile-menu-info">
        <span><i data-lucide="map-pin" style="width:12px;height:12px"></i> Av. Malecón Simón Bolívar & Calle Roca</span>
        <span><i data-lucide="phone" style="width:12px;height:12px"></i>0993886877</span>
      </div>
       -->
    </div>
  </nav>
</header>
